<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les 7 JavaScript opdracht_je_naam_herhaalt</title>

</head>
<!-- Schrijf een herhalingslus die de tekst "Hallo wereld" 6 keer schrijft in het document.
  De opmaak van de tekst moet gaan van <h1> naar <h6>. 
    Maak gebruik van de index i om de cijfers van de hoofdingen samen te stellen.


                 
-->

<body>
    <script type="text/javascript">

        for (let i = 0; i < 6; i++) {   // zes maal lussen
            document.write(`<h${i+1}>Hallo wereld </h${i+1}>`);   // h gaat van 1 tot 6

        }


    </script>


</body>

</html>
